version: "2.3"

services:
  xautollm-gpu:
    container_name: xautollm-gpu
    hostname: xautollm-gpu
    image: autogoal/xautollm:latest
    ports:
      - 8500:8501
      - 8000:8000
    volumes:
      - ".:/home/coder/autogoal"
      - "~/.ssh:/home/coder/.ssh"
      - "~/.gitconfig:/home/coder/.gitconfig"
    user: "1000:1000"
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
